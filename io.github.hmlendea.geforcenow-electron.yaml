app-id: io.github.hmlendea.geforcenow-electron
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
separate-locales: false
command: start-geforcenow-electron

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --socket=pulseaudio
  - --share=network
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=/run/udev:ro

modules:
  - name: geforcenow-electron-x86_64
    only-arches: [x86_64]
    buildsystem: simple
    build-commands:
      - unzip -d "geforcenow-electron" "geforcenow-electron.zip"
      - rm "geforcenow-electron.zip"
      - cp -r "geforcenow-electron" /app
      - install -Dm 644 "io.github.hmlendea.geforcenow-electron.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm 644 "io.github.hmlendea.geforcenow-electron.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm 644 "io.github.hmlendea.geforcenow-electron.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.appdata.xml"
      - install -Dm 755 "start-geforcenow-electron.sh" "/app/bin/start-geforcenow-electron"
    sources:
      - type: file
        url: https://github.com/hmlendea/gfn-electron/releases/download/v3.1.1/geforcenow-electron_3.1.1_linux_x64.zip
        dest-filename: geforcenow-electron.zip
        sha256: ba39a2fa7f7f8f18a745d843b7c6e27ddf65d2608db85991f3186925e7117872
        x-checker-data:
          type: json
          url: https://api.github.com/repos/hmlendea/gfn-electron/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="geforcenow-electron_" + $version +
            "_linux_x64.zip") | .browser_download_url
      - type: file
        path: io.github.hmlendea.geforcenow-electron.metainfo.xml
      - type: file
        path: io.github.hmlendea.geforcenow-electron.png
      - type: file
        path: io.github.hmlendea.geforcenow-electron.desktop
      - type: script
        commands:
          - for i in {0..9}; do
          - test -S $XDG_RUNTIME_DIR/discord-ipc-$i || ln -sf {app/com.discordapp.Discord,$XDG_RUNTIME_DIR}/discord-ipc-$i;
          - done
      - type: script
        dest-filename: start-geforcenow-electron.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/geforcenow-electron/geforcenow-electron /app/geforcenow-electron/geforcenow-electron
            --ozone-platform-hint=auto "$@"
  - name: geforcenow-electron-aarch64
    only-arches: [aarch64]
    buildsystem: simple
    build-commands:
      - unzip -d "geforcenow-electron" "geforcenow-electron.zip"
      - rm "geforcenow-electron.zip"
      - cp -r "geforcenow-electron" /app
      - install -Dm 644 "io.github.hmlendea.geforcenow-electron.png" "${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/${FLATPAK_ID}.png"
      - install -Dm 644 "io.github.hmlendea.geforcenow-electron.desktop" "${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop"
      - install -Dm 644 "io.github.hmlendea.geforcenow-electron.metainfo.xml" "${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.appdata.xml"
      - install -Dm 755 "start-geforcenow-electron.sh" "/app/bin/start-geforcenow-electron"
    sources:
      - type: file
        url: https://github.com/hmlendea/gfn-electron/releases/download/v3.1.1/geforcenow-electron_3.1.1_linux_arm64.zip
        dest-filename: geforcenow-electron.zip
        sha256: ff3ea21163a5782772bbaedbb4beb4736795ee37b26e2864c6ad5319a8a79535
        x-checker-data:
          type: json
          url: https://api.github.com/repos/hmlendea/gfn-electron/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name=="geforcenow-electron_" + $version +
            "_linux_arm64.zip") | .browser_download_url
      - type: file
        path: io.github.hmlendea.geforcenow-electron.metainfo.xml
      - type: file
        path: io.github.hmlendea.geforcenow-electron.png
      - type: file
        path: io.github.hmlendea.geforcenow-electron.desktop
      - type: script
        commands:
          - for i in {0..9}; do
          - test -S $XDG_RUNTIME_DIR/discord-ipc-$i || ln -sf {app/com.discordapp.Discord,$XDG_RUNTIME_DIR}/discord-ipc-$i;
          - done
      - type: script
        dest-filename: start-geforcenow-electron.sh
        commands:
          - export TMPDIR="$XDG_RUNTIME_DIR/app/$FLATPAK_ID"
          - exec zypak-wrapper /app/geforcenow-electron/geforcenow-electron /app/geforcenow-electron/geforcenow-electron
            --ozone-platform-hint=auto "$@"
